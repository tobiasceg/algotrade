# Scheduler for the trading bot (Step 1).
#
# PRIMARY TRIGGER: cron-job.org (free) calls this workflow's dispatch
# endpoint at the exact minute. GitHub's own cron is a congested best-effort
# queue: through August it ran 1-3h late, and on Aug 27-28 every slot fired
# 10+ hours late, after the close, so two trading days had no runs at all.
# An external trigger starts the runner within a minute of schedule.
#
# FALLBACK: a trimmed set of GitHub crons stays on. If cron-job.org ever
# fails, these still fire (late, but the aim-early sleep in main.py absorbs
# lag up to MAX_WAIT). The journal dedupe means whichever trigger gets there
# first does the work and the rest skip.
#
# Either way main.py sleeps from whenever it starts until the intended work
# time (entry 10:00 ET, exit 14:15 ET), so early firings land on target.

name: trading-bot

on:
  # Fallback only — see above. Every day: on closed days each firing logs a
  # timing probe, which keeps measuring GitHub's lag for free.
  schedule:
    - cron: "37 9 * * *"   # entry — 5:37 ET in summer; sleeps to 10:00
    - cron: "37 10 * * *"  # entry — DST twin (winter: 5:37 ET)
    - cron: "37 13 * * *"  # exit  — 9:37 ET in summer; sleeps to 14:15
    - cron: "7 16 * * *"   # exit  — DST twin / backup
  # The primary trigger (cron-job.org) and manual testing both use this.
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run to execute"
        required: true
        type: choice
        options: [entry, exit]
      cron:
        description: "Scheduled slot as a cron string (e.g. '45 13 * * *'), so the run can log its own lag"
        required: false
        type: string
        default: ""
      force:
        description: "Bypass the trading-day/time-window guard (manual testing only)"
        required: false
        type: boolean
        default: false

# Needed so the workflow can commit the decision journal back to the repo.
permissions:
  contents: write

# Serialize real runs — scheduled AND dispatched by cron-job.org — so by the
# time a backup starts, the earlier run has committed its journal record and
# the dedupe skips the backup cleanly. Only a forced manual test gets its own
# group, so it never queues behind a job that is mid-sleep.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.force && format('manual-{0}', github.run_id) || 'trading-bot' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Generous: an early firing can spend up to ~5h asleep waiting for
    # its target time. Idle runner time is free on a public repo.
    # (GitHub's hard per-job ceiling is 6h.)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Map whichever cron fired to a mode. github.event.schedule contains
      # the exact cron string that triggered this run; for manual runs we use
      # the dropdown input instead.
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ inputs.force && '--force' || '' }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "37 9 * * *"|"37 10 * * *"|"7 13 * * *"|"37 15 * * *") echo "mode=entry" >> "$GITHUB_OUTPUT" ;;
              *)                                                     echo "mode=exit"  >> "$GITHUB_OUTPUT" ;;
            esac
            echo "force=" >> "$GITHUB_OUTPUT"
          fi

      # A run that queued behind another can check out a snapshot taken
      # seconds before the previous run pushed its journal record — stale
      # enough to defeat the dedupe (2026-07-20: duplicate entry run and
      # duplicate Telegram). By the time this step runs, that push is tens
      # of seconds old, so an explicit pull always sees the latest journal.
      - name: Sync journal
        run: git pull --rebase origin main

      - name: Run bot
        id: bot
        run: python main.py --mode ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.force }}
        env:
          # Which slot triggered this run — lets main.py measure scheduling
          # lag on closed days. GitHub fills it for its own crons; cron-job.org
          # passes it as the `cron` input. Empty on a hand-run test.
          SCHEDULE_CRON: ${{ github.event.schedule || inputs.cron }}
          # Add these under repo Settings -> Secrets and variables -> Actions
          # as the later steps get built. Missing secrets are just empty here.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # The journal is the experiment's memory — commit it back so it survives
      # the ephemeral runner. Daily commits also keep GitHub's 60-day
      # inactivity rule from disabling the schedule.
      - name: Persist journal
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add journal.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "journal: ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      # Snapshots are too bulky for the repo; keep 90 days as artifacts.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: snapshots/
          if-no-files-found: ignore
          retention-days: 90
